<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fluitcoach — KNHB spelregels</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy:#0B1E3D;
    --navy-deep:#071531;
    --orange:#EE6C0A;
    --orange-bright:#FF8A2E;
    --white:#FFFFFF;
    --bg:#F1F3F7;
    --ink:#14213D;
    --grey:#6B7280;
    --line:#E1E4EA;
    --bubble-assistant:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
  }

  .app{
    position:fixed;
    top:0; left:0; right:0;
    width:100%;
    max-width:640px;
    margin:0 auto;
    height:100vh; /* JS overrides this with the real visible height below */
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---- Top bar (always visible, compact) ---- */
  .topbar{
    flex:0 0 auto;
    background:var(--navy);
    background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--white);
    padding:10px 16px;
    padding-top:calc(10px + env(safe-area-inset-top));
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    box-shadow:0 2px 8px rgba(7,21,49,0.25);
  }
  .topbar-badge{
    width:32px;
    height:32px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .topbar-badge svg{width:17px;height:17px;fill:var(--white);}
  .topbar-title{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    flex:1;
    min-width:0;
  }
  .topbar-title span{color:var(--orange-bright);}
  .topbar-cat{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--white);
    font-size:12px;
    font-weight:600;
    padding:6px 11px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
    white-space:nowrap;
  }
  .topbar-cat:hover{background:rgba(255,255,255,0.2);}

  /* ---- Age selection screen ---- */
  #selectScreen{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    padding:22px 18px 30px;
  }

  .select-hero{
    text-align:center;
    margin-bottom:18px;
  }
  .select-hero h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:22px;
    text-transform:uppercase;
    margin:0 0 6px;
    color:var(--navy);
  }
  .select-hero p{
    font-size:14px;
    color:var(--grey);
    line-height:1.5;
    max-width:440px;
    margin:0 auto;
  }

  .lineup{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    max-width:520px;
    margin:0 auto;
    width:100%;
  }
  @media (max-width:420px){
    .lineup{grid-template-columns:1fr;}
  }

  .shirt-btn{
    position:relative;
    background:var(--white);
    border:1.5px solid var(--line);
    border-left:5px solid var(--orange);
    border-radius:8px;
    padding:14px 14px 13px;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
    transition:border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    font-family:inherit;
  }
  .shirt-btn:hover, .shirt-btn:focus-visible{
    border-color:var(--orange);
    box-shadow:0 4px 14px rgba(238,108,10,0.18);
    transform:translateY(-1px);
    outline:none;
  }
  .shirt-num{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--orange);
    display:block;
    line-height:1;
  }
  .shirt-name{
    font-weight:700;
    font-size:14.5px;
    margin-top:5px;
    display:block;
    color:var(--navy);
  }
  .shirt-desc{
    font-size:12px;
    color:var(--grey);
    margin-top:3px;
    display:block;
    line-height:1.4;
  }

  /* ---- Chat screen ---- */
  #chatScreen{
    display:none;
    flex:1;
    min-height:0;
    flex-direction:column;
  }

  #messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 14px 14px;
    display:flex;
    flex-direction:column;
    align-content:flex-start;
    gap:10px;
  }

  .msg{
    max-width:87%;
    padding:11px 14px;
    border-radius:14px;
    line-height:1.48;
    font-size:15px;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--orange);
    color:var(--white);
    border-bottom-right-radius:3px;
  }
  .msg.assistant{
    align-self:flex-start;
    background:var(--bubble-assistant);
    border:1px solid var(--line);
    color:var(--ink);
    border-bottom-left-radius:3px;
  }

  .msg.system-note{
    align-self:center;
    background:none;
    border:1px dashed #C7CCD6;
    color:var(--grey);
    font-size:12px;
    font-style:italic;
    max-width:95%;
    text-align:center;
    padding:8px 12px;
  }

  .msg.error-note{
    align-self:center;
    background:#FEF1EE;
    border:1px solid #F5C6B8;
    color:#9A3412;
    font-size:12.5px;
    max-width:95%;
    text-align:center;
  }

  .thinking{
    align-self:flex-start;
    display:flex;
    gap:5px;
    padding:12px 15px;
    background:var(--bubble-assistant);
    border:1px solid var(--line);
    border-radius:14px;
    border-bottom-left-radius:3px;
  }
  .thinking span{
    width:6px;height:6px;border-radius:50%;
    background:var(--grey);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:0.15s;}
  .thinking span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,80%,100%{transform:translateY(0); opacity:0.4;}
    40%{transform:translateY(-4px); opacity:1;}
  }

  #inputBar{
    flex:0 0 auto;
    background:var(--white);
    border-top:1px solid var(--line);
    padding:12px 12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  #inputRow{
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  #inputField{
    flex:1;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 15px;
    color:var(--ink);
    font-size:16px;
    font-family:inherit;
    resize:none;
    min-height:76px;
    max-height:160px;
    line-height:1.4;
  }
  #inputField:focus{outline:none; border-color:var(--orange);}
  #inputField::placeholder{color:var(--grey);}

  #sendBtn{
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:12px;
    padding:0 20px;
    align-self:stretch;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
    flex:0 0 auto;
  }
  #sendBtn:disabled{opacity:0.45; cursor:default;}
  #sendBtn:hover:not(:disabled){background:var(--orange-bright);}

  .footnote{
    text-align:center;
    font-size:10.5px;
    color:var(--grey);
    padding-top:6px;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#C7CCD6; border-radius:3px;}
</style>
</head>

const SYSTEM_PROMPT_BASE = `Je bent "Fluitcoach", een ervaren Nederlandse hockeyscheidsrechterscoach en KNHB-kaderlid. Je helpt scheidsrechters, coaches en spelers om spelsituaties te beoordelen volgens de officiële KNHB-spelregels (Koninklijke Nederlandse Hockey Bond, spelreglement geldig per 1 augustus 2026, plus de Arbitrage Afspraken en Standaard Afspraken Veldhockey seizoen 2026-2027), NIET de kale FIH-regels — al volgt de KNHB de FIH grotendeels.

Belangrijke uitgangspunten:
- Geef eerst het oordeel/de beslissing, dan een korte onderbouwing (welke overtreding, welke spelhervatting: vrije slag, strafcorner, strafbal, welke persoonlijke straf indien van toepassing).
- Wees eerlijk over grijze gebieden en interpretatiekwesties (met name gevaarlijk spel, hoge bal, afhouden) — leg uit waar de nuance zit in plaats van te doen alsof er altijd één keihard antwoord is.
- Houd het antwoord kort en to-the-point (dit is een chat op een telefoon).
- Als een vraag niets met hockey-spelregels te maken heeft, stuur vriendelijk terug naar het onderwerp.
- BELANGRIJK: de KERNREGELS hieronder zijn geverifieerd tegen de officiële documenten en gaan altijd vóór je eigen algemene aannames. Verzin geen exacte cijfers, afstanden of tijden die niet expliciet gegeven zijn — zeg in dat geval dat je het niet zeker weet.

KERNREGELS (uit het officiële spelreglement en de arbitrage-afspraken 2026-2027):

Wedstrijdstructuur: standaard 4 kwarten van 17,5 minuut (70 min totaal), 2 min pauze na kwart 1 en 3, 5 min rust na kwart 2 (10 min bij standaard 1e teams). Team: max. 16 spelers op het formulier, max. 11 tegelijk op het veld, minimaal 8 spelers nodig om een bondswedstrijd te starten.

Strafcorner — wanneer: overtreding van verdediger in de cirkel (zonder duidelijk doelpunt te voorkomen), opzettelijke overtreding tegen balloze tegenstander in de cirkel, opzettelijke overtreding van verdediger binnen het 23-metergebied maar buiten de cirkel, opzettelijk over de achterlijn spelen door verdediger, bal vast in kleding/uitrusting van verdediger in de cirkel.
Strafcorner — uitvoering: max. 5 verdedigers (incl. keeper) achter de achterlijn, geen lichaamsdeel binnen het veld op de grond; aangever minstens 1 voet buiten het veld; overige aanvallers buiten de cirkel tot de bal gespeeld is; niemand anders dan de aangever binnen 5 meter van de bal; eerste schot als het een SLAG is moet onder de 460mm de doellijn passeren (bij push/flick/scoop/tip-in geen hoogtelimiet, mits niet gevaarlijk); teams krijgen na het fluitsignaal circa 40 seconden om klaar te staan.
Masker bij strafcorner: KNHB adviseert een masker te dragen, maar dit is NIET verplicht — een scheidsrechter mag hiervoor geen speel- of persoonlijke straf geven. Wel moet het masker zo snel mogelijk veilig worden afgezet zodra de strafcorner voorbij is (uitzondering: directe spelhervatting vóór de aanvallers na afloop). Blijft een verdediger het masker dragen tot voorbij de 23-meterlijn, dan volgt een vrije slag tegen op de plek buiten het 23-metergebied waar die speler stond. Onveilig wegwerpen van beschermingsmateriaal waarbij iemand in normale houding op/boven de knie geraakt wordt: gele kaart (5 min) voor gevaarlijk/nalatig gedrag, plus corner (binnen cirkel) of vrije slag (buiten cirkel) als het spel daardoor werd stilgelegd.

Hoge bal (regel 9.10): beoordeling op gevaar bij vertrek, vlucht én landing. De "duidelijke eerste ontvanger" (bepaald op het hoogste punt van de vlucht) heeft recht op de bal; tegenstanders moeten dan minimaal 5 meter afstand houden tot de eerste aanraking. Is er geen duidelijke eerste ontvanger (spelers binnen speelafstand van elkaar of samenkomend naar de landingsplek), dan direct affluiten wegens gevaar — de partij die niet hoog speelde krijgt de bal. Onderscheppen binnen 5 meter maar buiten speelafstand mag, mits veilig en zonder duel te veroorzaken; een onderschepping(spoging) binnen speelafstand, of een mislukte poging binnen 5 meter, is een onopzettelijke overtreding.

Afhouden: een speler mag een tegenstander die binnen speelafstand een actieve poging doet de bal te spelen niet blokkeren met lichaam of stick (ook "indirect afhouden/shadow" — vlak voor een tegenstander langslopen zonder de bal te spelen, telt ook als afhouden, ook bij verdedigers/keeper bij een strafcorner).

Gevaarlijk spel: een bal die leidt tot een terecht ontwijkende reactie is per definitie gevaarlijk. Opzettelijk hoog spelen met een SLAG mag niet (behalve schot op doel); met flick/scoop mag het wel, mits niet binnen 5 meter van een tegenstander en niet gevaarlijk.

Bal over de lijn: bij een onopzettelijke overtreding van de verdediger over de achterlijn (of afkaatsend van de keeper) volgt een lange corner op de 23-meterlijn tegenover het punt; bij opzet van de verdediger volgt een strafcorner; speelt een aanvaller de bal over de achterlijn, dan krijgt de verdediging een vrije slag (max. 15m van de achterlijn).

Persoonlijke straffen: groen = 2 min tijdstraf (waarschuwing); geel = minimaal 5 (of 10) minuten; rood = rest van de wedstrijd. Een tweede gele kaart voor dezelfde speler betekent automatisch een rode kaart (rest van de wedstrijd). Bij het geven van een kaart wordt de tijd stilgezet.

Keeper: mag binnen eigen cirkel de bal met elk lichaamsdeel spelen/stoppen/wegwerken; buiten de cirkel alleen met de stick; mag niet op de bal liggen.

De gebruiker heeft de volgende leeftijdscategorie/niveau gekozen voor dit hele gesprek — pas al je oordelen hierop toe zonder dat de gebruiker dit zelf hoeft te herhalen:
`;

function renderLineup(){
  const lineup = document.getElementById('lineup');
  lineup.innerHTML = '';
  CATEGORIES.forEach((cat) => {
    const btn = document.createElement('button');
    btn.className = 'shirt-btn';
    btn.innerHTML = `<span class="shirt-num">${cat.num}</span><span class="shirt-name">${cat.name}</span><span class="shirt-desc">${cat.desc}</span>`;
    btn.onclick = () => chooseCategory(cat);
    lineup.appendChild(btn);
  });
}

function chooseCategory(cat){
  selectedCategory = cat;
  conversation = [];
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  const pill = document.getElementById('categoryPill');
  pill.textContent = cat.name + ' · wijzig';
  pill.style.display = 'inline-block';
  document.getElementById('messages').innerHTML = '';
  addSystemNote(`Categorie ingesteld: ${cat.name}. Stel gerust je situatie.`);
  document.getElementById('inputField').focus();
}

function resetCategory(){
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('selectScreen').style.display = 'flex';
  document.getElementById('categoryPill').style.display = 'none';
  selectedCategory = null;
  conversation = [];
}

function addSystemNote(text){
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg system-note';
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addErrorNote(text){
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg error-note';
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(role, text){
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function showThinking(){
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinkingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeThinking(){
  const el = document.getElementById('thinkingIndicator');
  if(el) el.remove();
}

async function sendMessage(){
  const input = document.getElementById('inputField');
  const text = input.value.trim();
  if(!text || !selectedCategory) return;

  if(!GEMINI_API_KEY || GEMINI_API_KEY === "PLAK_HIER_JE_GEMINI_API_SLEUTEL"){
    addErrorNote('Er is nog geen Gemini API-sleutel ingesteld in dit bestand (zie GEMINI_API_KEY bovenin de code).');
    return;
  }

  addMessage('user', text);
  conversation.push({role: 'user', text: text});
  input.value = '';
  input.style.height = 'auto';

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  showThinking();

  const systemPrompt = SYSTEM_PROMPT_BASE + selectedCategory.systemNote;

  // Gemini uses "user"/"model" roles and a separate system_instruction field.
  const geminiContents = conversation.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.text }]
  }));

  let rawText = null;
  try{
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents: geminiContents,
          generationConfig: { maxOutputTokens: 1000 }
        })
      }
    );

    rawText = await response.text();

    let data;
    try{
      data = JSON.parse(rawText);
    }catch(parseErr){
      removeThinking();
      addErrorNote('Onverwacht antwoord van de server. Probeer het nog eens.');
      console.error('Kon antwoord niet als JSON lezen:', rawText);
      sendBtn.disabled = false;
      input.focus();
      return;
    }

    removeThinking();

    if(!response.ok){
      const errMsg = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + response.status);
      addErrorNote('Er ging iets mis: ' + errMsg);
      console.error('API error:', data);
      sendBtn.disabled = false;
      input.focus();
      return;
    }

    let replyText = "Sorry, geen antwoordtekst ontvangen.";
    const candidate = data && Array.isArray(data.candidates) ? data.candidates[0] : null;
    if(candidate && candidate.content && Array.isArray(candidate.content.parts)){
      const textParts = candidate.content.parts.filter(p => p && typeof p.text === 'string').map(p => p.text);
      if(textParts.length) replyText = textParts.join('\n');
    } else if(candidate && candidate.finishReason){
      replyText = "Geen antwoord ontvangen (reden: " + candidate.finishReason + "). Probeer je vraag anders te formuleren.";
    }

    addMessage('assistant', replyText);
    conversation.push({role: 'assistant', text: replyText});

  }catch(err){
    removeThinking();
    addErrorNote('Netwerkfout — controleer je verbinding en probeer het nog eens.');
    console.error('Fetch/network error:', err);
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

document.getElementById('inputField').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('inputField').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 110) + 'px';
});

renderLineup();

// Force the app container to the real visible viewport height.
// Embedded browsers (e.g. in-app previews) often don't handle
// 100vh/100dvh correctly, causing content to be cut off or requiring
// awkward scrolling. This keeps everything on one screen reliably.
function setAppHeight(){
  const appEl = document.querySelector('.app');
  appEl.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));
setAppHeight();
</script>
